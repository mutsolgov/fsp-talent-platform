services:
  db:
    image: postgres:16-alpine
    container_name: fsp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fsp_platform}
      POSTGRES_USER: ${POSTGRES_USER:-fsp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp_secret_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fsp_user} -d ${POSTGRES_DB:-fsp_platform}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - fsp-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fsp-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-fsp_user}:${POSTGRES_PASSWORD:-fsp_secret_dev}@db:5432/${POSTGRES_DB:-fsp_platform}}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-fsp_user}:${POSTGRES_PASSWORD:-fsp_secret_dev}@db:5432/${POSTGRES_DB:-fsp_platform}}
      SECRET_KEY: ${SECRET_KEY:-fsp_dev_super_secret_jwt_key_2026_jury_eval}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:-fsp_hmac_isomorphic_seed_key_2026}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-fsp_ats_webhook_secret_key_2026}
      COOLDOWN_DAYS: 90
      DEMO_BYPASS_ENABLED: "True"
      OFFLINE_MODE: "True"
    ports:
      - "8000:8000"
    volumes:
      - pdf_storage:/app/storage
      - ./assets/brand:/app/assets/brand:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/demo/metrics"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fsp-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fsp-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./assets/brand:/usr/share/nginx/html/brand:ro
      - ./frontend/public/fonts:/usr/share/nginx/html/fonts:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks:
      - fsp-net

volumes:
  pgdata:
  pdf_storage:

networks:
  fsp-net:
    driver: bridge
