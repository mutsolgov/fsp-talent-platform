services:
  db:
    image: postgres:16-alpine
    container_name: fsp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fsp_platform}
      POSTGRES_USER: ${POSTGRES_USER:-fsp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp_secret_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fsp_user} -d ${POSTGRES_DB:-fsp_platform}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - fsp-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fsp-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-fsp_user}:${POSTGRES_PASSWORD:-fsp_secret_dev}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-fsp_platform}}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-fsp_user}:${POSTGRES_PASSWORD:-fsp_secret_dev}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-fsp_platform}}
      SECRET_KEY: ${SECRET_KEY:-fsp_dev_super_secret_jwt_key_2026_jury_eval}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:-fsp_hmac_isomorphic_seed_key_2026}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-fsp_ats_webhook_secret_key_2026}
      COOLDOWN_DAYS: ${COOLDOWN_DAYS:-30}
      DEMO_BYPASS_ENABLED: ${DEMO_BYPASS_ENABLED:-True}
      OFFLINE_MODE: ${OFFLINE_MODE:-True}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/auth}
      KEYCLOAK_EXTERNAL_URL: ${KEYCLOAK_EXTERNAL_URL:-/auth}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-fsp-realm}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-fsp-frontend}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - pdf_storage:/app/storage
      - ./assets/brand:/app/assets/brand:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/demo/metrics"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fsp-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: fsp-keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-fsp_platform}
      KC_DB_USERNAME: ${POSTGRES_USER:-fsp_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-fsp_secret_dev}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_fsp_secret_2026}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fsp-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fsp-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./assets/brand:/usr/share/nginx/html/brand:ro
      - ./frontend/public/fonts:/usr/share/nginx/html/fonts:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks:
      - fsp-net

volumes:
  pgdata:
  pdf_storage:

networks:
  fsp-net:
    driver: bridge
